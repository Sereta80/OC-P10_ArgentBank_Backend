swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all endpoints for transactions management
  version: '1.0.0'
host: localhost:3001
basePath: /api/v1
schemes:
  - http

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

paths:
  /user/accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Get all transactions for the current month by account ID
      description: Returns a list of transactions associated with a specific account for the current month
      parameters:
        - name: accountId
          in: path
          required: true
          type: string
          description: Unique ID of the account
      responses:
        '200':
          description: Transactions fetched successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                type: array
                items:
                  $ref: '#/definitions/Transaction'
        '401':
          description: Unauthorized - Invalid or missing token
        '404':
          description: Account not found

  /user/transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Get transaction details
      description: Returns details of a specific transaction by its ID
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Unique ID of the transaction
      responses:
        '200':
          description: Transaction details retrieved successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/Transaction'
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found

    put:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Update transaction details
      description: Update information such as category or note for a specific transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Unique ID of the transaction
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/UpdateTransaction'
      responses:
        '200':
          description: Transaction information updated successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/Transaction'
        '400':
          description: Invalid input data
        '401':
          description: Unauthorized
        '404':
          description: Transaction not found

  /user/transactions/{transactionId}/note:
    delete:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Delete transaction note
      description: Removes the custom note attached to a specific transaction
      parameters:
        - name: transactionId
          in: path
          required: true
          type: string
          description: Unique ID of the transaction
      responses:
        '200':
          description: Note deleted successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
        '401':
          description: Unauthorized
        '404':
          description: Transaction or note not found

definitions:
  Transaction:
    type: object
    properties:
      id:
        type: string
      date:
        type: string
        format: date-time
      description:
        type: string
      amount:
        type: number
      balance:
        type: number
      transactionType:
        type: string
      category:
        type: string
      note:
        type: string

  UpdateTransaction:
    type: object
    properties:
      category:
        type: string
      note:
        type: string